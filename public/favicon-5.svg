<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 5: Otomotiv Kolaj — araba silueti içinde dolu sembol kolajı (anahtar, dişli, yıldız, OT, vs.) -->
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE6D0"/>
      <stop offset="100%" stop-color="#FFC2A0"/>
    </linearGradient>
    <radialGradient id="rim5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E8DCC4"/>
      <stop offset="100%" stop-color="#A6997E"/>
    </radialGradient>

    <!-- Araba silueti — clip-path için -->
    <clipPath id="carClip">
      <path d="M 12 130 Q 12 116 24 112 L 42 105 L 58 90 Q 68 70 90 65 L 130 65 Q 152 65 168 88 L 184 102 L 192 110 Q 196 116 196 128 L 196 150 Q 196 158 188 158 L 22 158 Q 12 158 12 150 Z"/>
    </clipPath>
  </defs>

  <rect width="200" height="200" rx="44" fill="url(#bg5)" stroke="#C2410C" stroke-width="6"/>

  <!-- Araba dolgusu (krem/beyaz) -->
  <g>
    <path d="M 12 130 Q 12 116 24 112 L 42 105 L 58 90 Q 68 70 90 65 L 130 65 Q 152 65 168 88 L 184 102 L 192 110 Q 196 116 196 128 L 196 150 Q 196 158 188 158 L 22 158 Q 12 158 12 150 Z" fill="#FFFFFF" stroke="#1F1A14" stroke-width="3"/>
    <!-- Cam vurgu -->
    <path d="M 70 105 Q 78 75 96 70 L 124 70 Q 144 72 156 92 L 156 105 Z" fill="#FFD2A8" opacity="0.9"/>
    <line x1="113" y1="70" x2="113" y2="105" stroke="#C2410C" stroke-width="2.5"/>
  </g>

  <!-- İÇERİK KOLAJI — clip-path ile araba içine kırpılır -->
  <g clip-path="url(#carClip)">
    <!-- Anahtar 1 (sol arka kısım) -->
    <g transform="translate(20 75) rotate(20) scale(1.3)" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </g>

    <!-- Dişli (üst-merkez) -->
    <g transform="translate(95 80)" fill="#EA580C">
      <circle r="9"/>
      <circle r="3.5" fill="#FFE6D0"/>
      <g>
        <rect x="-1.5" y="-13" width="3" height="4"/>
        <rect x="-1.5" y="9" width="3" height="4"/>
        <rect x="-13" y="-1.5" width="4" height="3"/>
        <rect x="9" y="-1.5" width="4" height="3"/>
        <g transform="rotate(45)">
          <rect x="-1.5" y="-13" width="3" height="4"/>
          <rect x="-1.5" y="9" width="3" height="4"/>
          <rect x="-13" y="-1.5" width="4" height="3"/>
          <rect x="9" y="-1.5" width="4" height="3"/>
        </g>
      </g>
    </g>

    <!-- Yıldız (sağ arka) -->
    <g transform="translate(140 78)" fill="#F59E0B">
      <path d="M 0 -10 L 3 -3 L 10 -3 L 4 2 L 6 9 L 0 5 L -6 9 L -4 2 L -10 -3 L -3 -3 Z"/>
    </g>

    <!-- "OT" monogram (sağ üst) -->
    <g transform="translate(165 92)">
      <text x="0" y="0" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1F1A14" text-anchor="middle">OT</text>
    </g>

    <!-- Bujı (sol-orta) -->
    <g transform="translate(40 130) rotate(-20)" fill="#C2410C">
      <rect x="-2.5" y="-8" width="5" height="12" rx="1"/>
      <rect x="-3.5" y="-12" width="7" height="4" rx="0.8" fill="#1F1A14"/>
      <line x1="0" y1="4" x2="0" y2="9" stroke="#1F1A14" stroke-width="2"/>
    </g>

    <!-- Yağ damlası (orta-alt) -->
    <g transform="translate(80 132)" fill="#1F1A14">
      <path d="M 0 -8 Q 6 -2 6 4 Q 6 10 0 10 Q -6 10 -6 4 Q -6 -2 0 -8 Z"/>
    </g>

    <!-- Şimşek/spark (sağ alt) -->
    <g transform="translate(125 130)" fill="#F59E0B" stroke="#C2410C" stroke-width="1.5" stroke-linejoin="round">
      <path d="M 4 -10 L -4 2 L 0 2 L -4 12 L 6 -2 L 2 -2 Z"/>
    </g>

    <!-- Onay ✓ (sol üst) -->
    <g transform="translate(60 75)" fill="#10B981" stroke="#FFFFFF" stroke-width="1.4">
      <circle r="9"/>
      <path d="M -5 0 L -1 4 L 5 -4" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Kalp (rating ikon, küçük) -->
    <g transform="translate(155 130)" fill="#DC2626">
      <path d="M 0 5 C -8 -2 -7 -10 0 -6 C 7 -10 8 -2 0 5 Z"/>
    </g>

    <!-- Mini anahtar 2 (orta) -->
    <g transform="translate(100 125) rotate(-30) scale(0.85)" fill="none" stroke="#7A2810" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </g>
  </g>

  <!-- Tekerlekler — jant detaylı, dış kenarda -->
  <g>
    <circle cx="56" cy="158" r="20" fill="#1A1410"/>
    <circle cx="56" cy="158" r="13" fill="url(#rim5)"/>
    <!-- Jant teli -->
    <g stroke="#1A1410" stroke-width="2">
      <line x1="56" y1="148" x2="56" y2="168"/>
      <line x1="46" y1="158" x2="66" y2="158"/>
      <line x1="49" y1="151" x2="63" y2="165"/>
      <line x1="49" y1="165" x2="63" y2="151"/>
    </g>
    <circle cx="56" cy="158" r="3" fill="#1A1410"/>

    <circle cx="148" cy="158" r="20" fill="#1A1410"/>
    <circle cx="148" cy="158" r="13" fill="url(#rim5)"/>
    <g stroke="#1A1410" stroke-width="2">
      <line x1="148" y1="148" x2="148" y2="168"/>
      <line x1="138" y1="158" x2="158" y2="158"/>
      <line x1="141" y1="151" x2="155" y2="165"/>
      <line x1="141" y1="165" x2="155" y2="151"/>
    </g>
    <circle cx="148" cy="158" r="3" fill="#1A1410"/>
  </g>

  <!-- Yer gölgesi -->
  <ellipse cx="100" cy="180" rx="80" ry="3" fill="#7A2810" opacity="0.15"/>
</svg>
