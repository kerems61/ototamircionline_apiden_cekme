<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 4: Onaylı Usta + Otomobil — krem zemin, görünür koyu otomobil, üstte beyaz İngiliz anahtarı, sağ üstte yeşil ✓ -->
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE6D0"/>
      <stop offset="100%" stop-color="#FFC2A0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g4)" stroke="#C2410C" stroke-width="2"/>

  <!-- Otomobil silueti (tam görünür koyu kahverengi) -->
  <g fill="#1F1A14">
    <path d="M 4 40 Q 4 36 8 35 L 17 32 Q 21 24 30 23 L 38 23 L 46 28 L 55 32 Q 59 33 59 40 L 59 47 Q 59 50 56 50 L 8 50 Q 4 50 4 47 Z"/>
  </g>
  <!-- Cam vurgusu (kabin için yumuşak şeftali) -->
  <path d="M 22 32 Q 25 25 31 24 L 37 24 L 43 29 L 22 29 Z" fill="#FFC2A0" opacity="0.65"/>
  <!-- Tekerlekler -->
  <circle cx="19" cy="50" r="5.5" fill="#1A1410" stroke="#FFE6D0" stroke-width="1"/>
  <circle cx="19" cy="50" r="2" fill="#FFE6D0"/>
  <circle cx="45" cy="50" r="5.5" fill="#1A1410" stroke="#FFE6D0" stroke-width="1"/>
  <circle cx="45" cy="50" r="2" fill="#FFE6D0"/>

  <!-- İngiliz anahtarı (beyaz, otomobilin üstüne biner — kontrast) -->
  <g transform="translate(18 16) scale(1.1)" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
  </g>

  <!-- Yeşil onay rozeti, sağ üst köşe -->
  <circle cx="52" cy="12" r="9" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 48 12 L 51 15 L 56 8.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
