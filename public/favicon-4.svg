<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 4: Onaylı Usta + Otomobil — krem zemin, akıcı sedan, anahtar diyagonal aracı keser, ✓ -->
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE6D0"/>
      <stop offset="100%" stop-color="#FFC2A0"/>
    </linearGradient>
    <linearGradient id="car4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A33717"/>
      <stop offset="100%" stop-color="#4A1808"/>
    </linearGradient>
    <radialGradient id="rim4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E8DCC4"/>
      <stop offset="100%" stop-color="#A6997E"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg4)" stroke="#C2410C" stroke-width="2"/>

  <!-- SEDAN — akıcı bezier eğrileri, gerçekçi oran -->
  <path d="M 4 42
           C 4 38, 6 36, 11 35
           L 17 32
           C 19 31, 21 28, 24 25
           C 26 22, 30 21, 34 21
           L 38 21
           C 41 21, 43 22, 45 25
           L 50 31
           L 56 33
           C 60 33, 60 36, 60 40
           L 60 46
           C 60 48, 58 49, 56 49
           L 8 49
           C 6 49, 4 48, 4 46 Z"
        fill="url(#car4)"/>

  <!-- Camlar -->
  <path d="M 22 30
           C 24 27, 27 24, 31 23
           L 38 23
           C 41 23, 43 25, 45 28
           L 47 30 Z"
        fill="#FFD2A8" opacity="0.88"/>
  <!-- B-pillar -->
  <line x1="34" y1="23" x2="34" y2="30" stroke="#4A1808" stroke-width="1"/>

  <!-- Tekerlekler -->
  <circle cx="17" cy="49" r="6.5" fill="#1A1410"/>
  <circle cx="17" cy="49" r="3.5" fill="url(#rim4)"/>
  <circle cx="17" cy="49" r="1" fill="#1A1410"/>
  <circle cx="48" cy="49" r="6.5" fill="#1A1410"/>
  <circle cx="48" cy="49" r="3.5" fill="url(#rim4)"/>
  <circle cx="48" cy="49" r="1" fill="#1A1410"/>

  <!-- ANAHTAR — diyagonal, aracın içinden geçer (koyu outline + beyaz iç → her zeminde okunur) -->
  <g transform="translate(13 12) scale(1.6)">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
          fill="none" stroke="#1F1A14" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Yeşil ✓ -->
  <circle cx="52" cy="12" r="9" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 48 12 L 51 15 L 56 8.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
