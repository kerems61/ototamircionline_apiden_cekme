<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 4: SUV + Onaylı Usta — krem zemin, gümüş gradient SUV, anahtar diyagonal aracı keser, ✓ -->
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE6D0"/>
      <stop offset="100%" stop-color="#FFC2A0"/>
    </linearGradient>
    <linearGradient id="suvBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4D6DB"/>
      <stop offset="55%" stop-color="#7E828A"/>
      <stop offset="100%" stop-color="#3A3D44"/>
    </linearGradient>
    <linearGradient id="suvWindow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EDF1"/>
      <stop offset="100%" stop-color="#B8C2CC"/>
    </linearGradient>
    <radialGradient id="rim4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E8DCC4"/>
      <stop offset="100%" stop-color="#7C7066"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg4)" stroke="#C2410C" stroke-width="2"/>

  <!-- SUV silüeti — uzun düz tavan, dik A/D pillar, kare arka -->
  <path d="M 4 42
           C 4 38, 6 35, 11 34
           L 18 32
           C 22 25, 26 20, 30 20
           L 44 20
           C 49 20, 53 26, 56 32
           L 60 34
           C 60 37, 60 40, 60 42
           L 60 47
           C 60 48, 58 49, 56 49
           L 8 49
           C 6 49, 4 48, 4 47 Z"
        fill="url(#suvBody)"/>

  <!-- Camlar (uzun, dik SUV pencereleri) -->
  <path d="M 19 30
           C 22 25, 26 22, 30 22
           L 44 22
           C 48 22, 52 25, 55 30 Z"
        fill="url(#suvWindow)" opacity="0.92"/>
  <!-- Pillar'lar (SUV'da belirgin) -->
  <line x1="32" y1="22" x2="32" y2="30" stroke="#3A3D44" stroke-width="1"/>
  <line x1="42" y1="22" x2="42" y2="30" stroke="#3A3D44" stroke-width="1"/>
  <!-- Tavan rayı (roof rail) -->
  <line x1="24" y1="20" x2="50" y2="20" stroke="#1F2024" stroke-width="0.6" opacity="0.7"/>

  <!-- Tekerlekler — büyük SUV tekerlekleri, off-road jant -->
  <circle cx="17" cy="49" r="7" fill="#1A1410"/>
  <circle cx="17" cy="49" r="4.2" fill="url(#rim4)"/>
  <g stroke="#1A1410" stroke-width="0.8">
    <line x1="17" y1="44.8" x2="17" y2="53.2"/>
    <line x1="12.8" y1="49" x2="21.2" y2="49"/>
    <line x1="14" y1="46" x2="20" y2="52"/>
    <line x1="14" y1="52" x2="20" y2="46"/>
  </g>
  <circle cx="17" cy="49" r="1.2" fill="#1A1410"/>

  <circle cx="47" cy="49" r="7" fill="#1A1410"/>
  <circle cx="47" cy="49" r="4.2" fill="url(#rim4)"/>
  <g stroke="#1A1410" stroke-width="0.8">
    <line x1="47" y1="44.8" x2="47" y2="53.2"/>
    <line x1="42.8" y1="49" x2="51.2" y2="49"/>
    <line x1="44" y1="46" x2="50" y2="52"/>
    <line x1="44" y1="52" x2="50" y2="46"/>
  </g>
  <circle cx="47" cy="49" r="1.2" fill="#1A1410"/>

  <!-- ANAHTAR — diyagonal, aracın içinden geçer (koyu outline + beyaz iç → her zeminde okunur) -->
  <g transform="translate(13 12) scale(1.55)">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
          fill="none" stroke="#1F1A14" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Yeşil ✓ -->
  <circle cx="52" cy="12" r="9" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 48 12 L 51 15 L 56 8.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
